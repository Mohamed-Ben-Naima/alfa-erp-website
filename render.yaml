services:
  - type: web
    runtime: static
    name: alfa-erp-website
    branch: main
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SITE_URL
        value: https://alfa-erp-website-0wgx.onrender.com
    headers:
      # Scripts and styles are locked by the hash-based CSP that Astro writes into each page
      # (security.csp in astro.config.mjs). Browsers enforce BOTH policies, so this header must not
      # set default-src, script-src or style-src: without Astro's hashes it would block every
      # inline script and style. It only adds what a <meta> CSP cannot carry, plus resource limits.
      - path: /*
        name: Content-Security-Policy
        value: "img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /shots/*
        name: Cache-Control
        value: public, max-age=86400
